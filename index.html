<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>♡</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    color: white;

    background:
        radial-gradient(
            circle at 50% 45%,
            #180006 0%,
            #080003 35%,
            #000 75%
        );

    touch-action: manipulation;
}


/* =========================
   FONDO
========================= */

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

.glow {
    position: absolute;

    width: 70vw;
    height: 70vw;

    max-width: 450px;
    max-height: 450px;

    left: 50%;
    top: 48%;

    transform: translate(-50%, -50%);

    background: #ff003c;

    filter: blur(110px);
    opacity: 0.07;

    animation: glow 5s ease-in-out infinite;
}

@keyframes glow {

    0%,100% {
        transform:
            translate(-50%, -50%)
            scale(.9);

        opacity: .05;
    }

    50% {
        transform:
            translate(-50%, -50%)
            scale(1.15);

        opacity: .12;
    }
}


/* =========================
   ESTRELLAS
========================= */

.star {
    position: absolute;

    color: white;

    font-size: 10px;

    opacity: 0;

    animation:
        starFloat
        linear
        forwards;
}

.star.red {
    color: #ff003c;
}

@keyframes starFloat {

    0% {
        opacity: 0;

        transform:
            translateY(30px)
            scale(.5);
    }

    15% {
        opacity: .8;
    }

    80% {
        opacity: .4;
    }

    100% {
        opacity: 0;

        transform:
            translateY(-150px)
            scale(1);
    }
}


/* =========================
   PANTALLAS
========================= */

.screen {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100dvh;

    display: flex;

    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;

    padding:
        35px
        25px
        max(35px, env(safe-area-inset-bottom))
        25px;

    opacity: 0;

    visibility: hidden;

    transform:
        scale(.96)
        translateY(15px);

    transition:
        opacity .8s ease,
        transform .8s
        cubic-bezier(.22,1,.36,1),
        visibility .8s;

    pointer-events: none;
}

.screen.active {

    opacity: 1;

    visibility: visible;

    transform:
        scale(1)
        translateY(0);

    pointer-events: auto;
}


/* =========================
   MENSAJE
========================= */

.message {

    width: 100%;

    max-width: 430px;

    font-size:
        clamp(36px, 9vw, 65px);

    line-height: 1.18;

    letter-spacing: -1px;

    font-weight: 500;

    text-shadow:
        0 0 25px
        rgba(255,255,255,.08);

    animation:
        messageAppear
        1s
        cubic-bezier(.22,1,.36,1)
        both;
}


/* Texto largo */

.message.long {

    font-size:
        clamp(27px, 7vw, 48px);

    line-height: 1.25;
}


/* Rojo */

.red {

    color: #ff1748;

    text-shadow:
        0 0 20px
        rgba(255,0,60,.45);
}


/* =========================
   BOTÓN
========================= */

.continue {

    margin-top: 55px;

    width: 76px;
    height: 76px;

    border-radius: 50%;

    border:
        1px solid
        rgba(255,255,255,.3);

    background:
        rgba(255,255,255,.035);

    color: white;

    font-size: 30px;

    display: flex;

    justify-content: center;
    align-items: center;

    cursor: pointer;

    backdrop-filter: blur(10px);

    box-shadow:
        0 0 25px
        rgba(255,0,60,.08);

    transition:
        transform .2s ease,
        background .2s ease,
        border .2s ease,
        box-shadow .2s ease;

    animation:
        buttonAppear
        1s
        .3s
        both;
}

.continue:active {

    transform: scale(.82);

    background:
        rgba(255,0,60,.18);

    border-color:
        #ff003c;

    box-shadow:
        0 0 35px
        rgba(255,0,60,.35);
}


/* =========================
   CORAZÓN
========================= */

.heart {

    color: #ff003c;

    text-shadow:
        0 0 15px #ff003c,
        0 0 35px
        rgba(255,0,60,.5);

    animation:
        heartbeat
        1.5s
        ease-in-out
        infinite;
}

@keyframes heartbeat {

    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.15);
    }
}


/* =========================
   PUNTITOS
========================= */

.dots {

    position: absolute;

    bottom: 25px;

    display: flex;

    gap: 9px;
}

.dot {

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.25);
}

.dot.active {

    background: #ff003c;

    box-shadow:
        0 0 8px #ff003c;
}


/* =========================
   CORAZONES AL TOCAR
========================= */

.tap-heart {

    position: fixed;

    pointer-events: none;

    z-index: 50;

    color: #ff003c;

    font-size: 20px;

    animation:
        heartFly
        1.2s
        ease-out
        forwards;
}

@keyframes heartFly {

    0% {

        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(.4);
    }

    50% {

        opacity: 1;

        transform:
            translate(-50%, -100px)
            scale(1.1);
    }

    100% {

        opacity: 0;

        transform:
            translate(-50%, -180px)
            scale(.7);
    }
}


/* =========================
   ANIMACIONES
========================= */

@keyframes messageAppear {

    from {

        opacity: 0;

        transform:
            translateY(30px)
            scale(.94);

        filter: blur(8px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

        filter: blur(0);
    }
}

@keyframes buttonAppear {

    from {

        opacity: 0;

        transform: scale(.5);
    }

    to {

        opacity: 1;

        transform: scale(1);
    }
}


/* =========================
   FINAL
========================= */

.final-message {

    max-width: 430px;

    font-size:
        clamp(28px, 7.5vw, 55px);

    line-height: 1.25;

    animation:
        finalAppear
        1.8s
        cubic-bezier(.22,1,.36,1)
        both;
}

.final-heart {

    margin-top: 35px;

    font-size: 58px;

    color: #ff003c;

    text-shadow:
        0 0 20px #ff003c,
        0 0 50px
        rgba(255,0,60,.5);

    animation:
        heartbeat
        1.5s
        infinite;
}

@keyframes finalAppear {

    0% {

        opacity: 0;

        transform:
            scale(.75)
            translateY(25px);

        filter: blur(12px);
    }

    60% {

        opacity: 1;

        transform:
            scale(1.04);

        filter: blur(0);
    }

    100% {

        opacity: 1;

        transform: scale(1);
    }
}


/* =========================
   CELULARES PEQUEÑOS
========================= */

@media (max-height: 650px) {

    .message {
        font-size: 42px;
    }

    .message.long {
        font-size: 28px;
    }

    .continue {

        margin-top: 35px;

        width: 65px;
        height: 65px;
    }
}

</style>
</head>


<body>


<!-- FONDO -->

<div class="background">

    <div class="glow"></div>

</div>


<!-- =========================
     1
========================= -->

<section
    class="screen active"
    id="screen1">

    <div class="message">

        Holita,
        <span class="red">
            precioso
        </span>

    </div>

    <button
        class="continue"
        onclick="next(1,event)">

        ♡

    </button>

    <div class="dots">

        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>

    </div>

</section>


<!-- =========================
     2
========================= -->

<section
    class="screen"
    id="screen2">

    <div class="message long">

        Te ves increíble hoy

        <br>

        <span class="red">
            (Siempre lo estás duh)
        </span>

    </div>

    <button
        class="continue"
        onclick="next(2,event)">

        ♡

    </button>

    <div class="dots">

        <span class="dot"></span>
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>

    </div>

</section>


<!-- =========================
     3
========================= -->

<section
    class="screen"
    id="screen3">

    <div class="message long">

        Feliz cumpleaños

        <br>

        <span class="red">
            mi corazon de melon
        </span>

    </div>

    <button
        class="continue"
        onclick="next(3,event)">

        <span class="heart">
            ♥
        </span>

    </button>

    <div class="dots">

        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>

    </div>

</section>


<!-- =========================
     4
========================= -->

<section
    class="screen"
    id="screen4">

    <div class="message long">

        Estás muy grande ya,

        <br>

        te queda muy bien
        el número

        <span class="red">
            18
        </span>

    </div>

    <button
        class="continue"
        onclick="next(4,event)">

        →

    </button>

    <div class="dots">

        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>

    </div>

</section>


<!-- =========================
     5
========================= -->

<section
    class="screen"
    id="screen5">

    <div class="message long">

        Te amo demasiado,

        <br>

        <span class="red">
            pookie pookie
        </span>

    </div>

    <button
        class="continue"
        onclick="next(5,event)">

        →

    </button>

    <div class="dots">

        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot active"></span>
        <span class="dot"></span>

    </div>

</section>


<!-- =========================
     FINAL
========================= -->

<section
    class="screen"
    id="screen6">

    <div class="final-message">

        Te amo con cada estrella
        que hay en el cielo,

        <br>

        <span class="red">
            nunca lo olvides.
        </span>

    </div>

    <div class="final-heart">
        ♥
    </div>

    <div class="dots">

        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot active"></span>

    </div>

</section>


<script>


/* =========================
   CAMBIAR PANTALLA
========================= */

function next(current, event) {

    if (event) {

        createHeart(
            event.clientX,
            event.clientY
        );

    }

    const currentScreen =
        document.getElementById(
            "screen" + current
        );

    const nextScreen =
        document.getElementById(
            "screen" + (current + 1)
        );

    if (!nextScreen) return;

    currentScreen.classList.remove(
        "active"
    );

    setTimeout(() => {

        nextScreen.classList.add(
            "active"
        );

    }, 120);


    /* Final */

    if (current === 5) {

        finalExplosion();

    }

}


/* =========================
   CORAZÓN AL TOCAR
========================= */

function createHeart(x, y) {

    const heart =
        document.createElement("div");

    heart.className =
        "tap-heart";

    heart.innerHTML =
        Math.random() > .5
        ? "♥"
        : "♡";

    heart.style.left =
        x + "px";

    heart.style.top =
        y + "px";

    document.body.appendChild(
        heart
    );

    setTimeout(() => {

        heart.remove();

    }, 1200);

}


/* =========================
   FINAL
========================= */

function finalExplosion() {

    const symbols =
        ["♥", "♡", "✦", "✧"];

    for (
        let i = 0;
        i < 35;
        i++
    ) {

        const heart =
            document.createElement(
                "div"
            );

        heart.className =
            "tap-heart";

        heart.innerHTML =
            symbols[
                Math.floor(
                    Math.random()
                    * symbols.length
                )
            ];

        heart.style.left =
            Math.random() * 100 + "vw";

        heart.style.top =
            (55 +
            Math.random() * 25)
            + "vh";

        heart.style.fontSize =
            (12 +
            Math.random() * 22)
            + "px";

        document.body.appendChild(
            heart
        );

        setTimeout(() => {

            heart.remove();

        }, 1300);

    }

}


/* =========================
   ESTRELLAS
========================= */

function createStar() {

    const star =
        document.createElement(
            "div"
        );

    star.className =
        "star";

    if (Math.random() > .7) {

        star.classList.add(
            "red"
        );

    }

    star.innerHTML =
        Math.random() > .5
        ? "✦"
        : "·";

    star.style.left =
        Math.random() * 100 + "vw";

    star.style.top =
        (65 +
        Math.random() * 35)
        + "vh";

    star.style.animationDuration =
        (3 +
        Math.random() * 4)
        + "s";

    document
        .querySelector(
            ".background"
        )
        .appendChild(star);

    setTimeout(() => {

        star.remove();

    }, 7000);

}


/* Estrellas constantes */

setInterval(
    createStar,
    400
);


/* Estrellas iniciales */

for (
    let i = 0;
    i < 12;
    i++
) {

    setTimeout(
        createStar,
        i * 200
    );

}

</script>

</body>
</html>
